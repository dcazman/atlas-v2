services:
  atlas-v2:
    image: dcazman/atlas:v2
    container_name: atlas-v2
    restart: unless-stopped
    ports:
      - "7790:7784"
    env_file:
      - /mnt/user/warehouse/atlas-v2/.env
    environment:
      - PORT=7784
      - ATLAS_DB_PATH=/app/data/atlas.db
    volumes:
      - /mnt/user/appdata/atlas-v2:/app/data
